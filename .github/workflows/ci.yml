name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build essentials (GCC / G++)
        run: sudo apt-get update && sudo apt-get install -y build-essential g++

      - name: Run Go Unit Tests
        run: go test -v -race ./internal/...

      - name: Run Integration Tests
        run: go test -v ./tests/...

      - name: Build Frontend
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build

      - name: Build ExecLens Binary
        run: go build -o execlens ./cmd/execlens

      - name: Run End-to-End Smoke Test
        run: ./scripts/smoke_test.sh
